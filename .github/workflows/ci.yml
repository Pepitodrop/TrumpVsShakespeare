name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc binutils clang
      - name: Build Assembly runtime
        run: ./scripts/build_native.sh
      - name: Validate AArch64 Assembly source
        run: clang --target=aarch64-linux-gnu -c src/trump_vs_shakespeare/native/combat_aarch64.S -o /tmp/combat_aarch64.o
      - name: Install project
        run: python -m pip install --constraint constraints.txt -e '.[dev]'
      - name: Validate dependency graph
        run: python -m pip check
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: ruff format --check src tests > /tmp/ruff-format.log 2>&1
      - name: Generate canonical formatting patch
        if: steps.formatting.outcome == 'failure'
        run: |
          ruff format src tests
          git diff -- src tests > /tmp/ruff-format.patch
      - name: Upload formatting diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-format-${{ matrix.python-version }}
          path: |
            /tmp/ruff-format.log
            /tmp/ruff-format.patch
          retention-days: 3
      - name: Report formatting failure
        if: steps.formatting.outcome == 'failure'
        run: |
          cat /tmp/ruff-format.log
          exit 1
      - name: Test
        run: pytest
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install vulnerability auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit the pinned production graph
        run: pip-audit --requirement constraints.txt --strict --format cyclonedx-json --output sbom.cdx.json
      - name: Upload audited SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1.0.1-production-sbom
          path: sbom.cdx.json
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build production image
        id: image-build
        continue-on-error: true
        run: docker build --progress=plain --tag trump-vs-shakespeare:ci . > /tmp/docker-build.log 2>&1
      - name: Upload Docker build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-build-log
          path: /tmp/docker-build.log
          retention-days: 3
      - name: Report Docker build failure
        if: steps.image-build.outcome == 'failure'
        run: |
          tail -n 120 /tmp/docker-build.log
          exit 1
      - name: Verify image security defaults
        run: |
          test "$(docker image inspect trump-vs-shakespeare:ci --format '{{.Config.User}}')" = "game"
          test "$(docker image inspect trump-vs-shakespeare:ci --format '{{json .Config.Healthcheck.Test}}')" != "null"
          test "$(docker image inspect trump-vs-shakespeare:ci --format '{{.Config.WorkingDir}}')" = "/app"
          test "$(docker image inspect trump-vs-shakespeare:ci --format '{{json .Config.Cmd}}')" = '["/opt/venv/bin/python","-m","trump_vs_shakespeare.cli"]'
      - name: Verify pinned runtime graph
        run: |
          docker run --rm --entrypoint python trump-vs-shakespeare:ci -m pip check
          docker run --rm --entrypoint python trump-vs-shakespeare:ci -c \
            "from trump_vs_shakespeare import __version__; assert __version__ == '1.0.1'"
      - name: Smoke-test production image
        run: |
          set -eu
          container_id="$(docker run --detach --read-only --tmpfs /tmp:size=16m --publish 127.0.0.1:18000:8000 trump-vs-shakespeare:ci)"
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/readyz >/tmp/ready.json; then
              grep -q '"status":"ready"' /tmp/ready.json
              grep -q '"moves":"8"' /tmp/ready.json
              grep -q '"stage":"validated"' /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become ready" >&2
          exit 1
      - name: Smoke-test checked-in Docker Compose path
        run: |
          set -eu
          cleanup() {
            docker compose logs || true
            docker compose down --remove-orphans --volumes >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker compose up --build --detach
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/readyz >/tmp/compose-ready.json; then
              grep -q '"status":"ready"' /tmp/compose-ready.json
              curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null
              curl --fail --silent --show-error http://127.0.0.1:8000/favicon.ico >/dev/null
              container_id="$(docker compose ps -q game)"
              test -n "$container_id"
              test "$(docker inspect "$container_id" --format '{{.State.Running}}')" = "true"
              test "$(docker inspect "$container_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
              test "$(docker inspect "$container_id" --format '{{json .HostConfig.CapDrop}}')" = '["ALL"]'
              exit 0
            fi
            sleep 1
          done
          echo "Docker Compose service did not become ready" >&2
          exit 1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build ARM64 production image
        run: docker buildx build --platform linux/arm64 --progress=plain .
