services:
  game:
    build:
      context: .
    image: trump-vs-shakespeare:1.0.0
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    environment:
      TVS_ALLOWED_ORIGINS: ${TVS_ALLOWED_ORIGINS:-}
      TVS_ROOM_TTL_SECONDS: ${TVS_ROOM_TTL_SECONDS:-7200}
      TVS_MAX_ROOMS: ${TVS_MAX_ROOMS:-1000}
      TVS_MAX_SOCKETS_PER_ROOM: ${TVS_MAX_SOCKETS_PER_ROOM:-6}
      TVS_SOCKET_SEND_TIMEOUT_SECONDS: ${TVS_SOCKET_SEND_TIMEOUT_SECONDS:-3}
      TVS_WS_IDLE_TIMEOUT_SECONDS: ${TVS_WS_IDLE_TIMEOUT_SECONDS:-60}
      TVS_WS_MESSAGES_PER_WINDOW: ${TVS_WS_MESSAGES_PER_WINDOW:-40}
      TVS_WS_RATE_WINDOW_SECONDS: ${TVS_WS_RATE_WINDOW_SECONDS:-10}
      TVS_ENABLE_DOCS: ${TVS_ENABLE_DOCS:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      WS_MAX_SIZE: ${WS_MAX_SIZE:-65536}
      WS_MAX_QUEUE: ${WS_MAX_QUEUE:-16}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
