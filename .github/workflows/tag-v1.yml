name: Tag v1.0.0

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Verify release metadata
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(python -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')" = "1.0.0"
          grep -q '^## \[1\.0\.0\] - 2026-07-12$' CHANGELOG.md
          grep -q '^# v1\.0\.0 release contract$' RELEASE.md
          git fetch origin main --tags
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - name: Create immutable annotated tag
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
            tagged_sha="$(git rev-list -n 1 v1.0.0)"
            test "$tagged_sha" = "$TARGET_SHA"
            echo "v1.0.0 already points to the certified commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate v1.0.0 "$TARGET_SHA" \
            --message "Trump vs. Shakespeare v1.0.0" \
            --message "Production-certified single-worker release. See RELEASE.md for the supported deployment contract."
          git push origin refs/tags/v1.0.0
